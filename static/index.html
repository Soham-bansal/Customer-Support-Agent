<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<title>Customer Support Copilot</title>
<style>
  :root {
    --paper: #000000;
    --surface: #0e0f11;
    --ink: #e8e8ea;
    --muted: #8e939b;
    --line: #26292e;
    --trace: #16181b;
    --accent: #7db4e6;
    --accent-ink: #06121d;
    --approve: #4cc38a;
    --reject: #ef7a6a;
    --sans: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    --mono: "Cascadia Mono", Consolas, "SF Mono", Menlo, monospace;
  }
  html { color-scheme: dark; }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.55;
  }

  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  button:disabled, input:disabled, textarea:disabled { cursor: not-allowed; opacity: 0.55; }

  .top {
    display: flex;
    flex-wrap: wrap;
    gap: 16px 32px;
    align-items: flex-end;
    justify-content: space-between;
    padding: 20px max(16px, calc((100% - 760px) / 2)) 16px;
    border-bottom: 1px solid var(--line);
    background: var(--surface);
  }
  .title h1 { margin: 0; font-size: 1.3rem; font-weight: 650; letter-spacing: -0.01em; }
  .title p { margin: 4px 0 0; color: var(--muted); font-size: 0.9rem; max-width: 52ch; }

  .controls { display: flex; gap: 10px; align-items: flex-end; }
  .key { display: grid; gap: 2px; font-size: 0.85rem; color: var(--muted); }
  .key input {
    width: 190px;
    height: 40px;
    padding: 0 10px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--paper);
  }

  .ghost {
    height: 40px;
    padding: 0 14px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: transparent;
  }
  .ghost:hover:not(:disabled) { background: var(--trace); }

  #chat {
    flex: 1;
    width: min(760px, 100%);
    margin: 0 auto;
    padding: 24px 16px 32px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .empty p { margin: 0 0 10px; color: var(--muted); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    min-height: 40px;
    padding: 6px 14px;
    border: 1px solid var(--line);
    border-radius: 20px;
    background: var(--surface);
    text-align: left;
  }
  .chip:hover { border-color: var(--accent); }

  .msg { max-width: 88%; padding: 10px 14px; border-radius: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.user { align-self: flex-end; background: var(--accent); color: var(--accent-ink); border-bottom-right-radius: 4px; }
  .msg.agent { align-self: flex-start; background: var(--surface); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .msg.error { align-self: flex-start; background: transparent; border: 1px solid var(--reject); color: var(--reject); }

  .working { color: var(--muted); font-size: 0.92rem; }
  .working::before {
    content: "";
    display: inline-block;
    width: 8px;
    height: 8px;
    margin-right: 8px;
    border-radius: 50%;
    background: var(--accent);
    animation: pulse 1.1s ease-in-out infinite;
  }
  @keyframes pulse { 50% { opacity: 0.25; } }
  @media (prefers-reduced-motion: reduce) { .working::before { animation: none; } }

  .steps {
    align-self: stretch;
    border-left: 3px solid var(--accent);
    background: var(--trace);
    border-radius: 0 6px 6px 0;
    padding: 8px 12px;
    font-size: 0.88rem;
  }
  .steps summary { cursor: pointer; color: var(--muted); }
  .step { display: flex; gap: 10px; margin-top: 6px; align-items: baseline; }
  .step .tag { flex: none; width: 62px; color: var(--muted); }
  .step code { font-family: var(--mono); font-size: 0.82rem; overflow-wrap: anywhere; white-space: pre-wrap; }

  .slip {
    /* A light slip on the black page: the one moment that needs a decision */
    --ink: #14181c;
    --muted: #5a6670;
    --line: #c9d0d6;
    --paper: #e9edf0;
    --trace: #dde3e8;
    --accent: #1d5f99;
    --approve: #1f7a52;
    --reject: #b3412f;
    align-self: stretch;
    padding: 18px 20px 16px;
    background: #f3f5f7;
    color: var(--ink);
    border: 1px solid #f3f5f7;
    border-top: 3px dashed #7b8791;
    border-radius: 3px 3px 8px 8px;
  }
  .slip.decided { opacity: 0.7; }
  .slip-title { margin: 0; color: var(--muted); font-size: 0.92rem; }
  .slip-amount { margin: 2px 0 12px; font-size: 2rem; font-weight: 650; letter-spacing: -0.02em; }
  .slip dl { display: grid; grid-template-columns: 9.5rem 1fr; gap: 6px 14px; margin: 0 0 16px; }
  .slip dt { color: var(--muted); }
  .slip dd { margin: 0; overflow-wrap: anywhere; }
  @media (max-width: 520px) { .slip dl { grid-template-columns: 1fr; gap: 0; } .slip dd { margin-bottom: 8px; } }

  .slip-actions, .reject-box { display: flex; flex-wrap: wrap; gap: 10px; }
  .slip button { min-height: 44px; padding: 0 18px; border-radius: 6px; border: 1px solid transparent; }
  .slip .approve { background: var(--approve); color: #fff; }
  .slip .reject { background: transparent; border-color: var(--reject); color: var(--reject); }
  .slip .reject.solid { background: var(--reject); color: #fff; }
  .slip .ghost { height: 44px; }
  .reject-box textarea {
    flex: 1 1 100%;
    padding: 8px 10px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--paper);
    resize: vertical;
  }
  .slip-result { margin: 12px 0 0; font-weight: 600; }

  .composer {
    position: sticky;
    bottom: 0;
    display: flex;
    gap: 10px;
    padding: 12px max(16px, calc((100% - 760px) / 2)) 16px;
    background: var(--surface);
    border-top: 1px solid var(--line);
  }
  .composer input {
    flex: 1;
    height: 46px;
    padding: 0 14px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--paper);
  }
  .composer button {
    height: 46px;
    padding: 0 22px;
    border: 0;
    border-radius: 8px;
    background: var(--accent);
    color: var(--accent-ink);
    font-weight: 600;
  }
</style>
</head>
<body>
  <header class="top">
    <div class="title">
      <h1>Customer Support Copilot</h1>
      <p>Ask about orders, tracking and refunds.</p>
    </div>
    <div class="controls">
      <button id="reset" type="button" class="ghost">New chat</button>
    </div>
  </header>

  <main id="chat" aria-live="polite">
    <div id="empty" class="empty">
      <p>Try one of these:</p>
      <div class="chips">
        <button type="button" class="chip">Where is order O-1006?</button>
        <button type="button" class="chip">Is O-1002 still refundable?</button>
        <button type="button" class="chip">Review all orders for customer C-02</button>
        <button type="button" class="chip">Refund O-1002 in full, the headphones stopped working</button>
      </div>
    </div>
  </main>

  <form id="composer" class="composer">
    <input id="text" type="text" autocomplete="off" aria-label="Message"
           placeholder="Ask about an order or request a refund">
    <button id="send" type="submit">Send</button>
  </form>

<script>
(function () {
  const chat = document.getElementById("chat");
  const empty = document.getElementById("empty");
  const textInput = document.getElementById("text");
  const sendBtn = document.getElementById("send");
  const resetBtn = document.getElementById("reset");
  const composer = document.getElementById("composer");

  const IDLE_PLACEHOLDER = "Ask about an order or request a refund";

  let threadId = null;
  let busy = false;
  let awaiting = false;
  let workingEl = null;
  let wakeTimer = null;

  // Everything from the server is inserted as text, never as HTML.
  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined && text !== null) e.textContent = text;
    return e;
  }

  function scrollDown() {
    window.scrollTo(0, document.body.scrollHeight);
  }

  function updateControls() {
    const locked = busy || awaiting;
    textInput.disabled = locked;
    sendBtn.disabled = locked;
    textInput.placeholder = awaiting ? "Decide on the refund above first" : IDLE_PLACEHOLDER;
  }

  function addBubble(role, text) {
    empty.hidden = true;
    const b = el("div", "msg " + role, text);
    chat.appendChild(b);
    scrollDown();
    return b;
  }

  function showWorking() {
    workingEl = el("div", "working", "Working on it...");
    chat.appendChild(workingEl);
    wakeTimer = setTimeout(function () {
      if (workingEl) workingEl.textContent = "Still working. A free server can take up to a minute to wake up.";
    }, 8000);
    scrollDown();
  }

  function hideWorking() {
    clearTimeout(wakeTimer);
    if (workingEl) { workingEl.remove(); workingEl = null; }
  }

  function money(n) {
    return "\u20B9" + Number(n).toLocaleString("en-IN");
  }

  async function api(path, body) {
    const res = await fetch(path, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });

    let data = {};
    try { data = await res.json(); } catch (e) { /* not JSON */ }

    if (!res.ok) {
      throw new Error(typeof data.detail === "string" ? data.detail : "The request failed (" + res.status + ").");
    }
    return data;
  }

  function renderSteps(steps) {
    const shown = (steps || []).filter(function (s) { return s.type !== "agent"; });
    if (!shown.length) return;

    const d = el("details", "steps");
    d.open = true;
    d.appendChild(el("summary", null, "What the agent did (" + shown.length + (shown.length === 1 ? " step)" : " steps)")));

    shown.forEach(function (s) {
      const row = el("div", "step");
      if (s.type === "tool_call") {
        row.appendChild(el("span", "tag", "Called"));
        row.appendChild(el("code", null, s.text));
      } else if (s.type === "tool_result") {
        row.appendChild(el("span", "tag", "Returned"));
        row.appendChild(el("code", null, s.text));
      } else {
        row.appendChild(el("span", "tag", "Note"));
        row.appendChild(el("span", null, s.text));
      }
      d.appendChild(row);
    });

    chat.appendChild(d);
    scrollDown();
  }

  function showApproval(info) {
    awaiting = true;
    updateControls();

    const slip = el("section", "slip");
    slip.setAttribute("aria-label", "Refund waiting for approval");
    slip.appendChild(el("p", "slip-title", "Refund waiting for your decision"));
    slip.appendChild(el("p", "slip-amount", money(info.amount)));

    const dl = el("dl");
    [
      ["Order", info.order_id + " (" + info.customer + ")"],
      ["Reason given", info.refund_reason],
      ["Eligibility", info.eligibility + ": " + info.eligibility_reason],
      ["Why it needs approval", info.why_approval],
    ].forEach(function (pair) {
      dl.appendChild(el("dt", null, pair[0]));
      dl.appendChild(el("dd", null, pair[1]));
    });
    slip.appendChild(dl);

    const actions = el("div", "slip-actions");
    const approveBtn = el("button", "approve", "Approve refund");
    const rejectBtn = el("button", "reject", "Reject refund");
    approveBtn.type = "button";
    rejectBtn.type = "button";
    actions.append(approveBtn, rejectBtn);
    slip.appendChild(actions);

    const rejectBox = el("div", "reject-box");
    rejectBox.hidden = true;
    const note = el("textarea");
    note.rows = 2;
    note.placeholder = "Reason for rejecting";
    note.setAttribute("aria-label", "Reason for rejecting");
    const confirmBtn = el("button", "reject solid", "Confirm rejection");
    const cancelBtn = el("button", "ghost", "Cancel");
    confirmBtn.type = "button";
    cancelBtn.type = "button";
    rejectBox.append(note, confirmBtn, cancelBtn);
    slip.appendChild(rejectBox);

    chat.appendChild(slip);
    scrollDown();

    const all = [approveBtn, rejectBtn, confirmBtn, cancelBtn, note];

    rejectBtn.onclick = function () {
      actions.hidden = true;
      rejectBox.hidden = false;
      note.focus();
    };
    cancelBtn.onclick = function () {
      rejectBox.hidden = true;
      actions.hidden = false;
    };

    async function decide(decision, noteText) {
      all.forEach(function (x) { x.disabled = true; });
      slip.classList.add("decided");
      const result = el("p", "slip-result",
        decision === "approve" ? "You approved this refund." : "You rejected this refund.");
      slip.appendChild(result);
      awaiting = false;

      const ok = await run(function () {
        return api("/approve", { thread_id: threadId, decision: decision, note: noteText });
      });

      if (!ok) {   // let the person try again
        awaiting = true;
        updateControls();
        slip.classList.remove("decided");
        result.remove();
        all.forEach(function (x) { x.disabled = false; });
      }
    }

    approveBtn.onclick = function () { decide("approve", ""); };
    confirmBtn.onclick = function () { decide("reject", note.value.trim()); };
  }

  function handle(data) {
    threadId = data.thread_id;
    renderSteps(data.steps);
    if (data.status === "waiting_for_approval") {
      showApproval(data.approval_request);
    } else {
      addBubble("agent", data.reply || "The agent finished without a reply.");
    }
  }

  async function run(call) {
    busy = true;
    updateControls();
    showWorking();
    let ok = true;
    try {
      handle(await call());
    } catch (e) {
      ok = false;
      addBubble("error", e.message || "Something went wrong.");
    } finally {
      hideWorking();
      busy = false;
      updateControls();
      if (!awaiting) textInput.focus();
    }
    return ok;
  }

  composer.addEventListener("submit", function (e) {
    e.preventDefault();
    const text = textInput.value.trim();
    if (!text || busy || awaiting) return;
    textInput.value = "";
    addBubble("user", text);
    run(function () { return api("/webhook", { message: text, thread_id: threadId }); });
  });

  document.querySelectorAll(".chip").forEach(function (chip) {
    chip.addEventListener("click", function () {
      if (busy || awaiting) return;
      textInput.value = chip.textContent;
      composer.requestSubmit();
    });
  });

  resetBtn.addEventListener("click", function () {
    if (busy) return;
    if (awaiting && !confirm("A refund is still waiting for your decision. Start a new chat anyway? That refund will not be processed.")) return;
    Array.from(chat.children).forEach(function (c) { if (c !== empty) c.remove(); });
    empty.hidden = false;
    threadId = null;
    awaiting = false;
    updateControls();
    textInput.focus();
  });

  updateControls();
})();
</script>
</body>
</html>
